name: 發佈加密網站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取出程式
        uses: actions/checkout@v4

      - name: 設定 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝
        run: npm ci

      - name: 安裝 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 確認公開專案沒有相片
        run: npm run check-privacy

      - name: 跑測試
        run: npm test

      - name: 確認有密碼先至繼續
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "$SITE_PASSWORD" ]; then
            echo "::error::未設定 SITE_PASSWORD。為咗保護內容，今次不會發佈任何檔案。"
            exit 1
          fi

      - name: 壓縮、嵌圖、加密
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          # 父資料夾編號只可以來自 secret。唔好 echo，亦都唔好印出個值。
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          CONTENT_REPO: ${{ secrets.CONTENT_REPO }}
          CONTENT_READ_TOKEN: ${{ secrets.CONTENT_READ_TOKEN }}
          # 每週 80 張相加密時會超過 Node 預設 heap（約 4GB）。
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: npm run build

      - name: 檢查輸出沒有明文或圖片
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: node scripts/verify-published.mjs

      - name: 確認沒有圖片檔
        run: |
          if find dist -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.gif' -o -iname '*.webp' -o -iname '*.svg' -o -iname '*.heic' -o -iname '*.heif' -o -iname '*.mp4' -o -iname '*.m4v' -o -iname '*.mov' -o -iname '*.webm' \) | grep -q .; then
            echo "::error::輸出含有圖片或影片檔，已停止，不會發佈。"
            exit 1
          fi
          test -f dist/index.html

      - name: 上傳網頁
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 發佈到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
