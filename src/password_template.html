<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <title>/*[|template_title|]*/0</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#d7eefe">
  <meta http-equiv="cache-control" content="no-cache">
  <meta http-equiv="pragma" content="no-cache">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; overflow-x: hidden; max-width: 100%; }
    body {
      min-height: 100dvh;
      color: #243844;
      font-family: "PingFang HK", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(circle at 10% -10%, #fff1be 0, transparent 36%),
        radial-gradient(circle at 110% 0%, #d7f0ff 0, transparent 42%),
        radial-gradient(circle at 80% 110%, #e5f7df 0, transparent 36%),
        #f4f9ff;
    }
    .hidden { display: none !important; }
    .loading, .gate {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    }
    .spinner {
      width: 2.2rem;
      height: 2.2rem;
      border: 0.28rem solid #d5e6f2;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading p { margin: 12px 0 0; font-weight: 700; }
    .loading-card, .card { text-align: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .gate { align-items: flex-start; }
    @media (min-height: 900px) {
      .gate { align-items: center; }
    }
    .card {
      width: min(440px, 100%);
      background: rgba(255, 255, 255, 0.95);
      border-radius: 28px;
      padding: 0 18px 18px;
      box-shadow: 0 16px 40px rgba(80, 130, 170, 0.16);
      overflow: hidden;
    }
    .cover-frame {
      margin: 0 -18px 12px;
      background: #fff;
      line-height: 0;
    }
    .cover-art {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 2000 / 1068;
      object-fit: cover;
    }
    h1 { margin: 0; font-size: clamp(1.7rem, 6vw, 2.1rem); line-height: 1.3; overflow-wrap: break-word; }
    .welcome { margin: 0; font-weight: 800; color: #3d6d86; }
    .lead, .fine, .remember-hint { overflow-wrap: break-word; }
    .lead { margin: 8px 0 0; line-height: 1.55; }
    .fine { margin: 6px 0 16px; color: #52697a; font-size: 0.92rem; line-height: 1.5; }
    .field { position: relative; margin-bottom: 12px; }
    #staticrypt-password {
      width: 100%;
      min-height: 52px;
      padding: 12px 52px 12px 14px;
      border: 2px solid #d5e6f2;
      border-radius: 16px;
      background: #fff;
      color: #243844;
      font: inherit;
      font-size: 16px;
    }
    .eye {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: #5d7384;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .eye svg { width: 24px; height: 24px; }
    .remember {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      text-align: left;
      margin: 0 0 14px;
      line-height: 1.45;
    }
    .remember input { width: 1.25rem; height: 1.25rem; margin-top: 0.15rem; flex: none; }
    .remember-title { display: block; font-weight: 800; }
    .remember-hint { display: block; color: #52697a; font-size: 0.92rem; }
    .go {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 999px;
      background: #ffe08a;
      color: #243844;
      font: inherit;
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
    }
    .error {
      min-height: 0;
      margin: 0 0 12px;
      color: #8a3d3d;
      font-weight: 700;
    }
    .error:not(:empty) {
      background: #ffe8e8;
      border-radius: 12px;
      padding: 8px 10px;
    }
    noscript p {
      width: min(440px, calc(100% - 32px));
      margin: 16px auto;
      background: #fff;
      border-radius: 16px;
      padding: 12px;
    }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
    }
  </style>
</head>
<body>
  <noscript><p>請開啟瀏覽器嘅 JavaScript，先可以輸入密碼。</p></noscript>
  <div id="staticrypt_loading" class="loading">
    <div class="loading-card">
      <div class="spinner" role="status"></div>
      <p>打開緊…</p>
    </div>
  </div>
  <div id="staticrypt_content" class="gate hidden">
    <div class="card">
      <div class="cover-frame"><!--COVER_ART--></div>
      <p class="welcome">歡迎</p>
      <h1>福泉堂 初級團</h1>
      <p class="lead">請輸入密碼。呢度只俾家長睇。</p>
      <p class="fine">密碼由教會同工私下告訴你。</p>
      <form id="staticrypt-form" action="#" method="post">
        <div class="field">
          <input id="staticrypt-password" type="password" name="password" placeholder="/*[|template_placeholder|]*/0" autocomplete="current-password" enterkeyhint="go" autofocus>
          <button class="staticrypt-toggle-password-visibility eye" type="button" aria-label="/*[|template_toggle_show|]*/0" title="/*[|template_toggle_show|]*/0">
            <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M2 5.3 3.4 4 20 20.6 18.6 22l-3.1-3.1A11 11 0 0 1 12 20C6 20 2.1 14.8 2.1 14.8a1.7 1.7 0 0 1 0-1.6A14 14 0 0 1 6.2 8.4L2 5.3Zm10 3.2a4 4 0 0 1 4 4l-1.5-1.5a2.2 2.2 0 0 0-2.5-2.5L10.5 7a4 4 0 0 1 1.5-.5ZM4.2 14c1.3 1.6 4 4.2 7.8 4.2 1 0 1.9-.2 2.8-.6l-1.6-1.6a4 4 0 0 1-5.2-5.2L6.4 9.2A13 13 0 0 0 4.2 14Zm15.6 0a14 14 0 0 0-2.4-2.9l1.5-1.5c.8.7 1.5 1.4 2.1 2.2a1.7 1.7 0 0 1 0 1.6S18 20 12 20l.2 0 1.6-1.6c3.2-.5 5.4-2.8 6-4.4Z"/>
            </svg>
            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true" hidden>
              <path fill="currentColor" d="M12 6c6 0 9.9 5.2 9.9 5.2a1.7 1.7 0 0 1 0 1.6S18 18 12 18 2.1 12.8 2.1 12.8a1.7 1.7 0 0 1 0-1.6S6 6 12 6Zm0 2C8.2 8 5.4 10.6 4.2 12 5.4 13.4 8.2 16 12 16s6.6-2.6 7.8-4C18.6 10.6 15.8 8 12 8Zm0 1.6A2.4 2.4 0 1 1 9.6 12 2.4 2.4 0 0 1 12 9.6Z"/>
            </svg>
          </button>
        </div>
        <p id="password-error" class="error" role="alert"></p>
        <label id="staticrypt-remember-label" class="remember hidden">
          <input id="staticrypt-remember" type="checkbox" name="remember">
          <span>
            <span class="remember-title">記住密碼</span>
            <span class="remember-hint">喺呢部裝置記住，大約半年內會自動打開。共用一部裝置嘅話，可以唔剔。</span>
          </span>
        </label>
        <button class="staticrypt-decrypt-button go" type="submit">進入</button>
      </form>
    </div>
  </div>
  <script>
    const staticryptInitiator = /*[|js_staticrypt|]*/0;
    const templateError = "/*[|template_error|]*/0",
      templateToggleAltShow = "/*[|template_toggle_show|]*/0",
      templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
      isRememberEnabled = /*[|is_remember_enabled|]*/0,
      staticryptConfig = /*[|staticrypt_config|]*/0;

    const templateConfig = {
      rememberExpirationKey: "staticrypt_expiration",
      rememberPassphraseKey: "staticrypt_passphrase",
      replaceHtmlCallback: null,
      clearLocalStorageCallback: null,
    };

    const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

    window.onload = async function () {
      const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
      if (!isSuccessful) {
        document.getElementById("staticrypt_loading").classList.add("hidden");
        document.getElementById("staticrypt_content").classList.remove("hidden");
        document.getElementById("staticrypt-password").focus();
        if (isRememberEnabled) {
          document.getElementById("staticrypt-remember-label").classList.remove("hidden");
        }
      }
    };

    const toggleIcon = document.querySelector(".staticrypt-toggle-password-visibility");
    toggleIcon.addEventListener("click", function () {
      const passwordInput = document.getElementById("staticrypt-password");
      const willShow = passwordInput.type === "password";
      passwordInput.type = willShow ? "text" : "password";
      toggleIcon.querySelector(".eye-open").hidden = !willShow;
      toggleIcon.querySelector(".eye-closed").hidden = willShow;
      const label = willShow ? templateToggleAltHide : templateToggleAltShow;
      toggleIcon.setAttribute("aria-label", label);
      toggleIcon.setAttribute("title", label);
    });

    document.getElementById("staticrypt-form").addEventListener("submit", async function (event) {
      event.preventDefault();
      const password = document.getElementById("staticrypt-password").value;
      const isRememberChecked = document.getElementById("staticrypt-remember").checked;
      const errorEl = document.getElementById("password-error");
      errorEl.textContent = "";
      const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);
      if (!isSuccessful) {
        errorEl.textContent = templateError;
        document.getElementById("staticrypt-password").focus();
      }
    });
  </script>
</body>
</html>
