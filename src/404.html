<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>搵唔到頁面 · 福泉堂 初級團</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
      color: #243844;
      font-family: "PingFang HK", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #f4f9ff;
    }
    main {
      width: min(440px, 100%);
      background: #fff;
      border-radius: 28px;
      padding: 24px 18px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(80, 130, 170, 0.16);
    }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p { margin: 0 0 16px; line-height: 1.6; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 8px 18px;
      border-radius: 999px;
      background: #ffe08a;
      color: #243844;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>搵唔到呢一頁</h1>
    <p>請返回首頁，再輸入密碼。</p>
    <a href="index.html">返回首頁</a>
  </main>
</body>
</html>
